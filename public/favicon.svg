<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="64" height="64">
  <defs>
    <linearGradient id="kmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E24" />
      <stop offset="100%" stop-color="#0B1030" />
    </linearGradient>
  </defs>

  <!-- Rounded dark background tile -->
  <rect width="120" height="120" rx="24" fill="url(#kmBg)" />
  <rect x="2" y="2" width="116" height="116" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />

  <!-- KM Monogram based on official KAMBALE MACHOZI logo -->
  <!-- Upper Left K stem and upper arm -->
  <path d="M 22 16 H 38 V 44 L 62 16 H 80 L 50 48 Z" fill="#FFFFFF" />
  <!-- Lower K leg -->
  <path d="M 22 68 L 38 56 V 76 H 22 Z" fill="#FFFFFF" />
  <path d="M 42 52 L 56 44 L 74 76 H 54 Z" fill="#FFFFFF" />

  <!-- Dynamic Red Upper Swoosh -->
  <path
    d="M 32 78 C 12 68, 28 42, 64 28 C 84 20, 100 18, 112 20 C 96 21, 76 26, 56 36 C 34 47, 22 64, 32 78 Z"
    fill="#D71920"
  />
  <!-- Dynamic White/Teal Lower Swoosh -->
  <path
    d="M 26 60 C 42 44, 72 28, 110 22 C 82 30, 54 44, 36 60 Z"
    fill="#F7C600"
  />

  <!-- Right M Monogram in Crimson Red -->
  <path
    d="M 66 44 L 78 38 L 90 52 L 106 30 V 76 H 93 V 52 L 82 65 L 76 58 V 74 L 66 64 Z"
    fill="#D71920"
  />

  <!-- KAMBALE text -->
  <text
    x="60"
    y="95"
    text-anchor="middle"
    font-family="'Sora', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="16"
    fill="#FFFFFF"
    letter-spacing="1.5"
  >
    KAMBALE
  </text>

  <!-- — MACHOZI — -->
  <line x1="12" y1="107" x2="27" y2="107" stroke="#D71920" stroke-width="2.5" />
  <text
    x="60"
    y="111"
    text-anchor="middle"
    font-family="'Sora', 'Arial', sans-serif"
    font-weight="700"
    font-size="9.5"
    fill="#F7C600"
    letter-spacing="2.5"
  >
    MACHOZI
  </text>
  <line x1="93" y1="107" x2="108" y2="107" stroke="#D71920" stroke-width="2.5" />
</svg>
